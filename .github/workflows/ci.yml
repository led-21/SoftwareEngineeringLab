name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SoftwareEngineeringLab.slnx

      - name: Build solution (Release)
        run: dotnet build SoftwareEngineeringLab.slnx --no-restore --configuration Release

      - name: Run unit tests (Release)
        run: dotnet test SoftwareEngineeringLab.slnx --no-build --configuration Release

  frontend:
    name: Frontend (Node.js & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (TypeScript check & Vite bundle)
        run: npm run build
